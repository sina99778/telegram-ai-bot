<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AI Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #11161d);
    --secbg: var(--tg-theme-secondary-bg-color, #1b2531);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8a9bb0);
    --link: var(--tg-theme-link-color, #5eb5f7);
    --btn: var(--tg-theme-button-color, #3390ec);
    --btntext: var(--tg-theme-button-text-color, #ffffff);
    --radius: 18px;
    --grad-brand: linear-gradient(135deg,#7b5cff 0%,#3390ec 55%,#27c4ff 100%);
    --grad-accent: linear-gradient(135deg,#ff7a59 0%,#ff4d8d 100%);
    --grad-gold: linear-gradient(135deg,#f7b733 0%,#fc4a1a 100%);
    --code-bg: #0c1118;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  .appbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--grad-brand);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25)}
  .appbar .logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:17px}
  .appbar .title{font-weight:800;font-size:16px;letter-spacing:.2px}
  .appbar .credits{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;white-space:nowrap}
  .appbar .ver{font-size:10px;opacity:.75;padding-left:4px}
  .tabs{display:flex;gap:6px;padding:10px;background:var(--secbg)}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:13px;color:var(--hint);font-weight:700;font-size:14px;cursor:pointer;transition:.18s;border:1px solid transparent}
  .tab.active{background:var(--grad-brand);color:#fff;box-shadow:0 4px 14px rgba(51,144,236,.4)}
  .page{flex:1;overflow-y:auto;padding:14px;display:none}
  .page.active{display:block}
  #chatPage{display:none;flex-direction:column;flex:1;overflow:hidden;padding:0}
  #chatPage.active{display:flex}
  #messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:84%;padding:11px 14px;border-radius:var(--radius);font-size:15px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.me{align-self:flex-end;background:var(--grad-brand);color:#fff;border-bottom-right-radius:6px;box-shadow:0 3px 12px rgba(51,144,236,.35);white-space:pre-wrap}
  .msg.ai{align-self:flex-start;background:var(--secbg);border-bottom-left-radius:6px}
  .msg.sys{align-self:center;background:transparent;color:var(--hint);font-size:13px;text-align:center;max-width:92%;white-space:pre-wrap}
  .msg.err{align-self:center;background:rgba(255,77,141,.14);color:#ff9bbb;font-size:13px;border:1px solid rgba(255,77,141,.3);max-width:92%}
  .msg img{max-width:100%;border-radius:12px;margin-bottom:6px;display:block}
  .msg b{font-weight:800}
  .inlinecode{background:rgba(255,255,255,.10);padding:1px 6px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  .codewrap{position:relative;margin:8px 0}
  .codewrap pre{margin:0;background:var(--code-bg);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 12px 12px;overflow-x:auto}
  .codewrap code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;color:#e6edf3;white-space:pre}
  .copybtn{position:absolute;top:6px;right:6px;border:none;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;padding:4px 8px;cursor:pointer}
  .copybtn:active{transform:scale(.92)}
  .composer{display:flex;gap:8px;align-items:flex-end;padding:10px;background:var(--secbg)}
  .composer textarea{flex:1;resize:none;max-height:120px;min-height:24px;background:var(--bg);color:var(--text);border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:11px 15px;font-size:15px;font-family:inherit}
  .iconbtn{width:46px;height:46px;border:none;border-radius:50%;background:var(--grad-brand);color:#fff;font-size:20px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(51,144,236,.4);transition:transform .12s}
  .iconbtn:active{transform:scale(.92)}
  .iconbtn:disabled{opacity:.5;box-shadow:none}
  .iconbtn.ghost{background:rgba(255,255,255,.08);color:var(--text);box-shadow:none}
  .card{background:var(--secbg);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05)}
  .card h3{margin:0 0 12px;font-size:16px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .row:last-child{border-bottom:none}
  .row .v{font-weight:800}
  .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:800;color:#fff}
  .chip.blue{background:var(--grad-brand)}.chip.gold{background:var(--grad-gold)}.chip.mut{background:rgba(255,255,255,.12);color:var(--hint)}
  .bigbtn{display:block;width:100%;padding:15px;border:none;border-radius:15px;background:var(--grad-accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;box-shadow:0 5px 16px rgba(255,77,141,.4);transition:transform .12s}
  .bigbtn:active{transform:scale(.98)}
  .muted{color:var(--hint);font-size:13px;line-height:1.5}
  .preview{padding:0 10px 8px;background:var(--secbg);display:none}
  .preview.show{display:flex;align-items:center;gap:10px}
  .preview img{height:48px;border-radius:8px}
  .typing{align-self:flex-start;color:var(--hint);font-size:14px;padding:8px 14px;background:var(--secbg);border-radius:var(--radius);border-bottom-left-radius:6px}
  .typing b{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hint);margin:0 1px;animation:blink 1.2s infinite}
  .typing b:nth-child(2){animation-delay:.2s}.typing b:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .banner{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:rgba(255,77,141,.14);color:#ff9bbb;font-size:13px;border:1px solid rgba(255,77,141,.3);display:none}
  .banner.show{display:block}
</style>
</head>
<body>
  <div class="appbar">
    <div class="logo">🤖</div>
    <div class="title">AI Assistant</div>
    <div class="credits" id="credits">…</div>
    <div class="ver" id="ver">v3</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="chat">💬 Chat</div>
    <div class="tab" data-tab="wallet">🪙 Wallet</div>
    <div class="tab" data-tab="profile">👤 Profile</div>
  </div>

  <div id="banner" class="banner"></div>

  <!-- CHAT -->
  <div id="chatPage" class="page active">
    <div id="messages"></div>
    <div id="preview" class="preview"></div>
    <div class="composer">
      <button class="iconbtn ghost" id="attachBtn" title="Attach">📎</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <textarea id="input" rows="1" placeholder="Message…"></textarea>
      <button class="iconbtn" id="sendBtn" title="Send">➤</button>
    </div>
  </div>

  <!-- WALLET -->
  <div id="walletPage" class="page">
    <div class="card">
      <h3>🪙 Your Wallet</h3>
      <div class="row"><span>💬 Normal credits</span><span class="v" id="wNormal">…</span></div>
      <div class="row"><span>👑 VIP credits</span><span class="v" id="wVip">…</span></div>
      <div class="row"><span>VIP access</span><span class="v" id="wVipStatus">…</span></div>
    </div>
    <div class="card">
      <h3>✨ Get more</h3>
      <p class="muted">Top up to keep chatting, unlock the Pro model, and generate images.</p>
      <button class="bigbtn" id="buyBtn">🛒 Open Store</button>
    </div>
  </div>

  <!-- PROFILE -->
  <div id="profilePage" class="page">
    <div class="card">
      <h3 id="pName">…</h3>
      <div class="row"><span>ID</span><span class="v" id="pId">…</span></div>
      <div class="row"><span>💬 Normal credits</span><span class="v" id="pNormal">…</span></div>
      <div class="row"><span>👑 VIP credits</span><span class="v" id="pVip">…</span></div>
      <div class="row"><span>Plan</span><span class="v" id="pPlan"><span class="chip mut">…</span></span></div>
    </div>
    <p class="muted" style="text-align:center">Powered by your AI Assistant ✨</p>
  </div>

<script>
(function(){
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor && tg.setHeaderColor("#5b6cff"); } catch(e){}
  }
  const initData = tg ? (tg.initData || "") : "";
  const headers = () => ({ "X-Telegram-Init-Data": initData });

  function haptic(kind){
    try{
      if(!tg || !tg.HapticFeedback) return;
      if(kind==="success"||kind==="error"||kind==="warning") tg.HapticFeedback.notificationOccurred(kind);
      else tg.HapticFeedback.impactOccurred(kind||"light");
    }catch(e){}
  }

  const banner = document.getElementById("banner");
  const showBanner = t => { banner.textContent = t; banner.classList.add("show"); };
  const hideBanner = () => banner.classList.remove("show");

  // ── Tabs ──
  const pages = { chat:"chatPage", wallet:"walletPage", profile:"profilePage" };
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{
      haptic("light");
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      Object.values(pages).forEach(id=>document.getElementById(id).classList.remove("active"));
      document.getElementById(pages[t.dataset.tab]).classList.add("active");
      if (t.dataset.tab !== "chat") loadMe();
    };
  });

  // ── Safe markdown rendering (code fences, inline code, **bold**) ──
  // Everything is built with textContent / text nodes → no HTML injection.
  function appendInline(parent, line){
    const re = /(`[^`]+`|\*\*[^*]+\*\*)/g;
    let last = 0, m;
    while ((m = re.exec(line)) !== null){
      if (m.index > last) parent.appendChild(document.createTextNode(line.slice(last, m.index)));
      const tok = m[0];
      if (tok[0] === "`"){ const c=document.createElement("code"); c.className="inlinecode"; c.textContent=tok.slice(1,-1); parent.appendChild(c); }
      else { const b=document.createElement("b"); b.textContent=tok.slice(2,-2); parent.appendChild(b); }
      last = m.index + tok.length;
    }
    if (last < line.length) parent.appendChild(document.createTextNode(line.slice(last)));
  }
  function appendInlineBlock(parent, text){
    const lines = text.split("\n");
    lines.forEach((ln, i)=>{ appendInline(parent, ln); if (i < lines.length-1) parent.appendChild(document.createElement("br")); });
  }
  function renderMarkdown(container, text){
    const parts = String(text).split("```");
    parts.forEach((part, idx)=>{
      if (idx % 2 === 1){
        // fenced code block — drop an optional leading language label line
        let code = part;
        const m = part.match(/^([A-Za-z0-9_+#.\-]{1,20})\n([\s\S]*)$/);
        if (m) code = m[2];
        code = code.replace(/\n$/, "");
        const wrap = document.createElement("div"); wrap.className="codewrap";
        const pre = document.createElement("pre"); const c = document.createElement("code");
        c.textContent = code; pre.appendChild(c); wrap.appendChild(pre);
        const btn = document.createElement("button"); btn.className="copybtn"; btn.textContent="📋 copy";
        btn.onclick = ()=>{
          try{ navigator.clipboard && navigator.clipboard.writeText(code); }catch(e){}
          btn.textContent="✓ copied"; haptic("success");
          setTimeout(()=>btn.textContent="📋 copy", 1200);
        };
        wrap.appendChild(btn); container.appendChild(wrap);
      } else if (part){
        const span = document.createElement("span"); appendInlineBlock(span, part); container.appendChild(span);
      }
    });
  }

  // ── Messages ──
  const messages = document.getElementById("messages");
  function addMsg(text, cls, imgUrl){
    const d = document.createElement("div");
    d.className = "msg " + cls;
    if (imgUrl){ const im=document.createElement("img"); im.src=imgUrl; d.appendChild(im); }
    if (text){
      if (cls === "ai") renderMarkdown(d, text);
      else { const sp=document.createElement("span"); sp.textContent=text; d.appendChild(sp); }
    }
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
    return d;
  }
  function addTyping(){
    const d = document.createElement("div"); d.className="typing"; d.innerHTML="<b></b><b></b><b></b>";
    messages.appendChild(d); messages.scrollTop = messages.scrollHeight; return d;
  }
  addMsg("👋 Hi! Send a message — or attach an image with 📎 and ask about it.", "sys");
  if (!initData) showBanner("⚠️ Open this app from the bot (tap 🚀 Open App) so it can sign you in.");

  // ── Attach / preview ──
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  let pendingFile = null;
  document.getElementById("attachBtn").onclick = ()=>{ haptic("light"); fileInput.click(); };
  fileInput.onchange = ()=>{
    pendingFile = fileInput.files[0] || null;
    preview.innerHTML = "";
    if (pendingFile){
      preview.classList.add("show");
      if (pendingFile.type.startsWith("image/")){ const im=document.createElement("img"); im.src=URL.createObjectURL(pendingFile); preview.appendChild(im); }
      const name=document.createElement("span"); name.className="muted"; name.textContent=pendingFile.name; preview.appendChild(name);
      const x=document.createElement("button"); x.className="iconbtn ghost"; x.textContent="✕"; x.style.width="32px"; x.style.height="32px"; x.onclick=clearFile; preview.appendChild(x);
    } else preview.classList.remove("show");
  };
  function clearFile(){ pendingFile=null; fileInput.value=""; preview.classList.remove("show"); preview.innerHTML=""; }

  // ── Send ──
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; });

  async function send(){
    const text = input.value.trim();
    if (!text && !pendingFile) return;
    haptic("light");
    sendBtn.disabled = true;
    const imgUrl = (pendingFile && pendingFile.type.startsWith("image/")) ? URL.createObjectURL(pendingFile) : null;
    addMsg(text, "me", imgUrl);
    input.value=""; input.style.height="auto";
    const fd = new FormData();
    fd.append("message", text);
    if (pendingFile) fd.append("file", pendingFile);
    clearFile();
    const typing = addTyping();
    try{
      const r = await fetch("/webapp/api/chat", { method:"POST", headers: headers(), body: fd });
      let j = null; try { j = await r.json(); } catch(_) { j = null; }
      typing.remove();
      if (j && j.reply){
        addMsg(j.reply, "ai");
        haptic(j.success === false ? "error" : "success");
        if (j.error === "auth") showBanner("⚠️ Open this app from the bot (tap 🚀 Open App) to sign in.");
        if (j.success === false && (j.error==="insufficient_funds" || j.error==="vip_credits_depleted"))
          addMsg("🪙 Tap Wallet above to top up.", "sys");
        loadMe(); // refresh the live credit badge after a charge
      } else {
        const detail = (j && (j.detail || j.error)) ? (j.detail || j.error) : ("HTTP " + r.status);
        addMsg("⚠️ Couldn't get a reply (" + detail + "). Please try again.", "err");
        haptic("error");
      }
    }catch(e){
      typing.remove();
      addMsg("⚠️ Could not reach the server. Check your connection and try again.", "err");
      haptic("error");
    }
    finally{ sendBtn.disabled=false; }
  }
  sendBtn.onclick = send;
  input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});

  // ── Wallet / profile / live credit badge ──
  function setCredits(m){
    const cr = document.getElementById("credits");
    if (m && typeof m.normal_credits !== "undefined") cr.textContent = "🪙 " + m.normal_credits + " · 👑 " + m.vip_credits;
  }
  async function loadMe(){
    try{
      const r = await fetch("/webapp/api/me", { headers: headers() });
      if(!r.ok){ if (r.status === 401) showBanner("⚠️ Session expired. Reopen the app from the bot (🚀 Open App)."); return; }
      hideBanner();
      const m = await r.json();
      setCredits(m);
      document.getElementById("wNormal").textContent = m.normal_credits;
      document.getElementById("wVip").textContent = m.vip_credits;
      document.getElementById("wVipStatus").textContent = m.has_vip ? "✅ Active" : "—";
      document.getElementById("pName").textContent = "👤 " + m.name;
      document.getElementById("pId").textContent = m.telegram_id;
      document.getElementById("pNormal").textContent = m.normal_credits;
      document.getElementById("pVip").textContent = m.vip_credits;
      const plan = document.getElementById("pPlan"); plan.innerHTML = "";
      const chip = document.createElement("span"); chip.className = "chip " + (m.has_vip ? "gold" : "mut");
      chip.textContent = m.has_vip ? "👑 VIP" : "Free"; plan.appendChild(chip);
    }catch(e){}
  }
  document.getElementById("buyBtn").onclick = ()=>{ haptic("light"); if(tg){ tg.close(); } };

  loadMe();
})();
</script>
</body>
</html>
